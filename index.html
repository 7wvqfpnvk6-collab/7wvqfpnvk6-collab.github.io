<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keeshond Jump</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: #70c5ce;
}

canvas {
  display: block;
}

.screen {
  position: absolute;
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  background: rgba(0,0,0,0.5);
  color: white;
  font-family: sans-serif;
}

button {
  padding: 15px 25px;
  font-size: 18px;
  border-radius: 10px;
  border: none;
}
</style>
</head>

<body>

<canvas id="gameCanvas"></canvas>

<div id="startScreen" class="screen">
  <h1>Keeshond Jump 🐶</h1>
  <button onclick="startGame()">Start</button>
</div>

<div id="gameOverScreen" class="screen" style="display:none;">
  <h1>Game Over</h1>
  <p id="scoreText"></p>
  <button onclick="restartGame()">Spela igen</button>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// 🔧 Resize fix
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

// 🐶 Enkel "Keeshond" (ingen extern bild = stabilt)
function drawDog(x, y, size) {
  ctx.fillStyle = "#f4a261";
  ctx.beginPath();
  ctx.arc(x + size/2, y + size/2, size/2, 0, Math.PI * 2);
  ctx.fill();
}

// Game state
let dog, pipes, score, running;

// Init
function init() {
  dog = {
    x: 80,
    y: canvas.height / 2,
    size: 40,
    velocity: 0
  };

  pipes = [];
  score = 0;
}

// Start
function startGame() {
  document.getElementById("startScreen").style.display = "none";
  init();
  running = true;
  loop();
}

// Restart
function restartGame() {
  document.getElementById("gameOverScreen").style.display = "none";
  init();
  running = true;
  loop();
}

// Jump
function jump() {
  if (!running) return;
  dog.velocity = -9;
}

document.addEventListener("touchstart", jump);
document.addEventListener("mousedown", jump);

// Pipes
function createPipe() {
  let gap = 160;
  let top = Math.random() * (canvas.height - gap - 100) + 50;

  pipes.push({
    x: canvas.width,
    width: 60,
    top: top,
    passed: false
  });
}

// Update
function update() {
  dog.velocity += 0.5;
  dog.y += dog.velocity;

  if (dog.y < 0 || dog.y + dog.size > canvas.height) {
    gameOver();
  }

  if (Math.random() < 0.02) createPipe();

  pipes.forEach((p, i) => {
    p.x -= 3;

    // collision
    if (
      dog.x < p.x + p.width &&
      dog.x + dog.size > p.x &&
      (dog.y < p.top || dog.y + dog.size > p.top + 160)
    ) {
      gameOver();
    }

    // score
    if (!p.passed && p.x + p.width < dog.x) {
      score++;
      p.passed = true;
    }

    if (p.x < -p.width) pipes.splice(i, 1);
  });
}

// Draw
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // dog
  drawDog(dog.x, dog.y, dog.size);

  // pipes
  ctx.fillStyle = "green";
  pipes.forEach(p => {
    ctx.fillRect(p.x, 0, p.width, p.top);
    ctx.fillRect(p.x, p.top + 160, p.width, canvas.height);
  });

  // score
  ctx.fillStyle = "white";
  ctx.font = "30px sans-serif";
  ctx.fillText(score, 20, 50);
}

// Game over
function gameOver() {
  running = false;
  document.getElementById("scoreText").innerText = "Poäng: " + score;
  document.getElementById("gameOverScreen").style.display = "flex";
}

// Loop
function loop() {
  if (!running) return;
  update();
  draw();
  requestAnimationFrame(loop);
}
</script>

</body>
</html>
